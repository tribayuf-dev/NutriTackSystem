const IDB_NAME='nutritrack_db',IDB_STORE='images';
let _idb=null;
function getIDB(){
  if(_idb)return Promise.resolve(_idb);
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(IDB_NAME,1);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
      };
      req.onsuccess=e=>{_idb=e.target.result;resolve(_idb)};
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
async function idbSetImage(id,dataUrl){
  if(!id||!dataUrl)return false;
  const db=await getIDB();if(!db)return false;
  return new Promise(resolve=>{
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(dataUrl,id);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    }catch(e){resolve(false)}
  });
}
async function idbGetAllImages(){
  const db=await getIDB();if(!db)return {};
  return new Promise(resolve=>{
    try{
      const tx=db.transaction(IDB_STORE,'readonly');
      const store=tx.objectStore(IDB_STORE);
      const req=store.openCursor(),res={};
      req.onsuccess=e=>{
        const c=e.target.result;
        if(c){res[c.key]=c.value;c.continue()}
        else resolve(res);
      };
      req.onerror=()=>resolve({});
    }catch(e){resolve({})}
  });
}
async function idbDeleteImage(id){
  const db=await getIDB();if(!db)return false;
  return new Promise(resolve=>{
    try{
      const tx=db.transaction(IDB_STORE,'readwrite');

      tx.onerror=()=>resolve(false);
    }catch(e){resolve(false)}
  });
}
function compressThumb(src,cb,maxDim=480,quality=0.72){
  if(!src||typeof src!=='string'){if(cb)cb(src);return}
  const im=new Image();
  im.onload=()=>{
    try{
      const scale=Math.min(1,maxDim/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*scale));
      c.height=Math.max(1,Math.round(im.height*scale));
      const ctx=c.getContext('2d');
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(im,0,0,c.width,c.height);
      const res=c.toDataURL('image/jpeg',quality);
      if(cb)cb(res);
    }catch(e){if(cb)cb(src)}
  };
  im.onerror=()=>{if(cb)cb(src)};
  im.src=src;
}

function curUserWeight() {
  const w = (S.wt || []).filter(x => x.kg > 0).sort((a,b) => a.d < b.d ? -1 : 1);
  return (w.length ? w[w.length - 1].kg : (S.pf && S.pf.w)) || 60;

function calcExBurned(met, durationMin, weightKg) {
  const w = weightKg || curUserWeight();
  const m = Math.max(0, num(durationMin) || 0);
  const metVal = Number.isFinite(met) && met > 0 ? met : 5.0;
  return Math.round(metVal * w * (m / 60));
}

// ─── UX Lanjutan: Voice Input Logging (Web Speech API) ───────────────────────────
let VOICE_RECORDING = false;
let _speechRecognizer = null;

function parseVoiceInput(rawText) {
  if (!rawText || !rawText.trim()) return;
  const text = rawText.trim().toLowerCase();

  const numWords = {
    'setengah': 0.5, 'seperempat': 0.25, 'satu': 1, 'dua': 2, 'tiga': 3,
    'empat': 4, 'lima': 5, 'enam': 6, 'tujuh': 7, 'delapan': 8,
    'sembilan': 9, 'sepuluh': 10, 'sebelas': 11, 'dua belas': 12,
    'dua puluh': 20, 'tiga puluh': 30, 'empat puluh': 40, 'lima puluh': 50,
    'seratus': 100, 'dua ratus': 200, 'tiga ratus': 300, 'empat ratus': 400, 'lima ratus': 500
  };

  let qty = null;
  let unit = null;
  let cleanText = text;

  const units = ['gram', 'g', 'kg', 'butir', 'buah', 'potong', 'piring', 'mangkuk', 'lembar', 'bungkus', 'gelas', 'cangkir', 'sendok', 'sdm', 'sdt', 'porsi', 'tusuk'];

  for (const [w, val] of Object.entries(numWords)) {
    const reg = new RegExp(`\\b${w}\\b`, 'gi');
    if (reg.test(cleanText)) cleanText = cleanText.replace(reg, val);
  }

  const unitPattern = new RegExp(`(\\d+(?:[.,]\\d+)?)\\s*(${units.join('|')})\\b`, 'i');
  const match = cleanText.match(unitPattern);
  if (match) {
    qty = parseFloat(match[1].replace(',', '.'));
    unit = match[2].toLowerCase();
    if (unit === 'gram') unit = 'g';
    cleanText = cleanText.replace(match[0], '').trim();
  } else {
    const numOnly = cleanText.match(/\b(\d+(?:[.,]\\d+)?)\b/);
    if (numOnly) {
      qty = parseFloat(numOnly[1].replace(',', '.'));
      cleanText = cleanText.replace(numOnly[0], '').trim();
    }
  }

  cleanText = cleanText.replace(/\b(tolong|catat|tambahkan|makan|minum|porsi|nya|sebanyak|buat|untuk)\b/gi, '').trim();

  const candidates = typeof all === 'function' ? all() : [];
  let bestMatch = null;
  if (cleanText.length >= 2) {
    bestMatch = candidates.find(f => f.n.toLowerCase() === cleanText);
    if (!bestMatch) {
      bestMatch = candidates.find(f => f.n.toLowerCase().includes(cleanText) || cleanText.includes(f.n.toLowerCase()));
    }
    if (!bestMatch) {
      const tokens = cleanText.split(/\s+/).filter(t => t.length >= 2);
      if (tokens.length > 0) {
        bestMatch = candidates.find(f => {
          const fn = f.n.toLowerCase();
          return tokens.every(tok => fn.includes(tok));
        });
      }
    }
  }

  if (MD) {
    if (bestMatch) {
      MD.fo = bestMatch.id;
      const availableUnits = typeof un === 'function' ? un(bestMatch) : [];
      if (unit && availableUnits.includes(unit)) {
        MD.u = unit;
      } else {
        MD.u = Object.keys(bestMatch.s || {})[0] || 'g';
      }
      MD.n = qty ? String(qty) : '1';
      MD.gx = '';
      MD.p100 = null;
      MD.fresh = false;
      calcLd();
      tst(`🎙️ Berhasil mendeteksi: ${bestMatch.n} (${MD.n} ${MD.u})`);
    } else {
      if (MD.mode === 'man') {
        MD.mn.n = cleanText || text;
      } else {
        MD.q = cleanText || text;
      }
      tst(`🎙️ Suara terdeteksi: "${text}"`);
    }
    render();
  }
}

function toggleVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    tst('Peramban Anda belum mendukung Web Speech Recognition. Gunakan pencarian teks biasa.');
    return;
  }

  if (VOICE_RECORDING) {
    if (_speechRecognizer) {
      try { _speechRecognizer.stop(); } catch(e){}
    }
    VOICE_RECORDING = false;
    render();
    return;
  }

  try {
    const rec = new SpeechRecognition();
    rec.lang = 'id-ID';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      VOICE_RECORDING = true;
      render();
      tst('🎙️ Mendengarkan... Ucapkan makanan dan porsi (mis. "nasi putih 200 gram")');
    };

    rec.onresult = (e) => {
      VOICE_RECORDING = false;
      const transcript = e.results?.[0]?.[0]?.transcript || '';
      if (transcript) {
        parseVoiceInput(transcript);
      } else {
        render();
      }
    };

    rec.onerror = (e) => {
      VOICE_RECORDING = false;
      render();
      if (e.error === 'not-allowed') {
        tst('Izin mikrofon ditolak. Izinkan mikrofon di browser untuk menggunakan fitur suara.');
      } else if (e.error !== 'no-speech') {
        tst('Pengenalan suara gagal (' + e.error + '), silakan coba lagi.');
      }
    };

    rec.onend = () => {
      VOICE_RECORDING = false;
      render();
    };

    _speechRecognizer = rec;
    rec.start();
  } catch(err) {
    VOICE_RECORDING = false;
    render();
    tst('Gagal memulai mikrofon: ' + err.message);
  }
}

// ─── NutriBot AI Companion (Tahap 4) ──────────────────────────────────────────
function renderMd(text){
  if(!text)return '';
  let s=String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre style="background:var(--tk);padding:8px 12px;border-radius:8px;font-size:12px;overflow-x:auto;margin:6px 0;font-family:monospace"><code>${c.trim()}</code></pre>`);
  s=s.replace(/`([^`]+)`/g,'<code style="background:var(--tk);padding:2px 6px;border-radius:4px;font-size:12px;font-family:monospace">$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<i>$2</i>');
  s=s.replace(/\[(?:FOOD|CARD):\s*([^|\]]+)\s*\|\s*([^|\]]+)\s*\|\s*([^\]]+)\]/gi,(_,name,kcal,prot)=>{
    const kNum=String(kcal).replace(/[^\d.]/g,'')||'0';
    const pNum=String(prot).replace(/[^\d.]/g,'')||'0';
    return `__FOOD_CARD__:${name.trim()}::${kNum}::${pNum}__FOOD_CARD__`;
  });
  const lines=s.split('\n');let inList=false,listTag='ul';const out=[];
  for(let line of lines){
    const trm=line.trim();
    if(trm.startsWith('__FOOD_CARD__:')&&trm.endsWith('__FOOD_CARD__')){
      if(inList){out.push(`</${listTag}>`);inList=false}
      const raw=trm.slice(14,-13);
      const parts=raw.split('::');
      const fName=parts[0]||'Makanan',fKcal=parts[1]||'0',fProt=parts[2]||'0';
      out.push(`<div style="margin:10px 0;padding:12px 14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06)">
        <div style="width:36px;height:36px;border-radius:10px;background:#ecfdf5;color:#00875a;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          ${MS('restaurant',18)}
        </div>
        <div style="flex:1;min-width:0;text-align:left">
          <b style="font-size:13px;font-weight:700;color:#111827;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fName}</b>
          <span style="font-size:11.5px;color:#6b7280;font-weight:500;display:block;margin-top:2px">${fKcal} kcal • <span style="color:#00875a;font-weight:700">${fProt}g Protein</span></span>
        </div>
        <button style="padding:6px 14px;font-size:12px;font-weight:700;background:#00875a;color:#ffffff;border-radius:8px;border:none;cursor:pointer;flex-shrink:0" data-a="chatlogfood" data-name="${fName}" data-kcal="${fKcal}" data-p="${fProt}">
          + Log
        </button>
      </div>`);
    }else if(/^[-*•]\s+(.*)/.test(trm)){
      const item=trm.replace(/^[-*•]\s+/,'');
      if(!inList||listTag!=='ul'){if(inList)out.push(`</${listTag}>`);out.push('<ul style="padding-left:18px;margin:4px 0;list-style-type:disc">');inList=true;listTag='ul'}
      out.push(`<li style="margin:2px 0">${item}</li>`);
    }else if(/^\d+\.\s+(.*)/.test(trm)){
      const item=trm.replace(/^\d+\.\s+/,'');
      if(!inList||listTag!=='ol'){if(inList)out.push(`</${listTag}>`);out.push('<ol style="padding-left:18px;margin:4px 0;list-style-type:decimal">');inList=true;listTag='ol'}
      out.push(`<li style="margin:2px 0">${item}</li>`);
    }else{
      if(inList){out.push(`</${listTag}>`);inList=false}
      if(trm==='')out.push('<div style="height:6px"></div>');
      else out.push(`<p style="margin:4px 0;line-height:1.5">${line}</p>`);
    }
  }
  if(inList)out.push(`</${listTag}>`);
  return out.join('');
}

function getNutriBotContext(){

    consumedFiber:Math.round((T.fi||0)*10)/10,
    consumedWater:W,
    burnedKcal:burned,

    }
  };
}

        tst('Dikte: "'+transcript+'"');
      }
      CHAT_VOICE_RECORDING=false;
      render();
      setTimeout(()=>{
        const inp=document.getElementById('chat-input');
        if(inp){inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(_){}}
      },50);
    };

    rec.onerror=e=>{
      CHAT_VOICE_RECORDING=false;
      render();
      if(e.error!=='no-speech'){
        tst('Dikte suara: '+(e.error||'Terjadi gangguan mikrofon.'));
      }
    };

    rec.onend=()=>{
      CHAT_VOICE_RECORDING=false;
      render();
    };

    _chatSpeechRecognizer=rec;
    rec.start();
  }catch(err){
    CHAT_VOICE_RECORDING=false;
    render();
    tst('Gagal memulai mikrofon: '+err.message);
  }
}

function getClientClinicalResponse(ctx, userMsg, hasImage = false){
  const safeNum=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;if(typeof v==='string'){const n=parseFloat(v.replace(',','.'));return Number.isFinite(n)?n:0;}return 0;};
  const rawMsg=(userMsg||'').trim();
  const msg=rawMsg.toLowerCase();
  const name=esc(ctx.name||S.u.name||'Sarah');
  const remKcal=Math.round(safeNum(ctx.remainingKcal));
  const targetP=Math.round(safeNum(ctx.targetProtein)||75);
  const consumedP=Math.round(safeNum(ctx.consumedProtein));
  const pDeficit=Math.max(0,targetP-consumedP);
  const pPercent=targetP>0?Math.round((consumedP/targetP)*100):100;
  const consumedWater=Math.round(safeNum(ctx.consumedWater));
  const targetWater=Math.round(safeNum(ctx.targetWater)||2000);

  // 1. Konsultasi Foto Makanan
  if(hasImage){
    const estKcal = Math.max(250, Math.min(remKcal > 0 ? remKcal : 400, 500));
    return `Halo ${name}! Saya melihat foto hidangan yang kamu lampirkan. 📸
Berdasarkan analisis visual dan data harianmu (sisa target: **${remKcal > 0 ? remKcal + ' kcal' : 'kuota kalori terjaga'}**, kebutuhan protein: **${pDeficit > 0 ? pDeficit + 'g lagi' : 'terpenuhi'}**):

• Makanan tampak bergizi dengan kombinasi karbohidrat dan lauk berprotein.
• Perkiraan porsi ini berada di kisaran ~${estKcal - 50} - ${estKcal + 50} kkal, cocok dikonsumsi untuk memenuhi target harianmu.

Berikut kartu cepat untuk mencatatnya ke jurnal harian:
[FOOD: Porsi Makanan pada Foto | ${estKcal} | 24]

Klik **+ Log** di atas untuk langsung mencatatnya ke jurnal harian, atau tanyakan jika ada bahan khusus yang ingin kamu ketahui lebih detail!`;

  // Helper pencocokan kata kunci
  const hasWord = (...words) => words.some(w => msg.includes(w));

  // 2. Pesan Uji Coba / Diagnostic / Ping ("test", "tes", "testing", "ping", "p", "cek", "123")

📊 **Ringkasan Nutrisimu Saat Ini**:
• Sisa Kuota Kalori: **${remKcal > 0 ? remKcal + ' kcal' : '0 kcal (Target tercapai)'}**
• Kebutuhan Protein: **${pDeficit > 0 ? pDeficit + 'g lagi (' + pPercent + '% tercapai)' : 'Sudah terpenuhi 🎉'}**

Sistem berjalan normal. Kamu bisa menanyakan rekomendasi menu sarapan/siang/malam, ide camilan sehat, evaluasi hidrasi, atau lampirkan foto makanan untuk saya analisis!`;

  // 3. Sapaan Ramah / Greetings ("halo", "hai", "selamat pagi", dsb.)
  if (isExactOrShort('halo', 'hai', 'hello', 'hi', 'hei', 'hey', 'pagi', 'selamat pagi', 'siang', 'selamat siang', 'sore', 'selamat sore', 'malam', 'selamat malam', 'assalamualaikum') || msg.startsWith('halo ') || msg.startsWith('hai ')) {

Sebagai **NutriTrack AI Coach**, saya siap membantumu menjaga pola makan sehat harian:

  // 4. Perkenalan / Fitur / Bantuan ("kamu siapa", "bisa apa", "fitur apa", "bantu apa")
  if (hasWord('siapa kamu', 'kamu siapa', 'bisa apa', 'fitur', 'bantu apa', 'bantuan', 'panduan', 'cara pakai')) {

  // 8. Makan Malam / Dinner

  }

  // 9. Camilan / Snack
  if (hasWord('camilan', 'snack', 'ngemil')) {
    return `Pilihan terbaik untuk camilan sehat ${pDeficit > 0 ? 'tinggi protein (' + pDeficit + 'g lagi)' : 'rendah kalori'} tanpa mengorbankan kuota harian:

[FOOD: Greek Yogurt + Chia Seeds | 130 | 17]

💡 Camilan ini kaya serat dan protein sehingga memberikan rasa kenyang lebih stabil dan aman untuk gula darah. Klik **+ Log** untuk langsung mencatatnya!`;

  // 10. Status Hidrasi
  if (hasWord('hidrasi', 'air', 'minum', 'haus')) {
    const sisaAir = Math.max(0, targetWater - consumedWater);
    const persentase = Math.min(100, Math.round((consumedWater / targetWater) * 100));
    return `Halo ${name}! Evaluasi status hidrasimu hari ini:
💧 **Asupan Air**: ${consumedWater} ml / ${targetWater} ml (${persentase}%)
${sisaAir > 0
  ? `Kamu masih butuh sekitar **${sisaAir} ml** (~${Math.ceil(sisaAir / 250)} gelas) lagi hingga malam ini. Disarankan minum 1 gelas sekarang dan 1 gelas sebelum tidur agar metabolisme tetap lancar.`
  : `🎉 **Luar biasa!** Target hidrasi harianmu sebesar **${targetWater} ml** sudah terpenuhi optimal hari ini. Pertahankan hidrasi baikmu!`}`;
  }

  // 11. Analisis Protein
  if (hasWord('protein', 'makro', 'otot')) {
    return `Analisis asupan protein harianmu:
🥩 **Realisasi**: ${consumedP}g / ${targetP}g (${pPercent}%)
${pDeficit > 0
  ? `Kamu masih membutuhkan **${pDeficit}g protein lagi** untuk mencapai target harianmu (${targetP}g) agar pembentukan massa otot dan rasa kenyang tetap optimal.

Berikut opsi penambah protein cepat:

Klik **+ Log** untuk langsung menambahkannya ke jurnal!`
  : `🎉 Target protein harianmu sebesar **${targetP}g** sudah tercapai! Otot dan sistem imun tubuhmu ternutrisi dengan baik hari ini.`}`;

function handleChatPhotoSelect(e){
  const file = e && e.target && e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      const maxDim = 800;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const cvs = document.createElement('canvas');
      cvs.width = w;
      cvs.height = h;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      CHAT_IMAGE = cvs.toDataURL('image/jpeg', 0.82);
      render();
      setTimeout(()=>{
        const inp = document.getElementById('chat-input');
        if(inp) inp.focus();
      }, 50);
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

async function sendNutriBotMessage(textOverride){
  const inp=document.getElementById('chat-input');
  let text=(textOverride||(inp?inp.value:'')||CHAT_INPUT||'').trim();
  const attachedImg=CHAT_IMAGE;
  if((!text && !attachedImg)||CHAT_LOADING)return;

  if(!text && attachedImg){
    text='Tolong analisis foto makanan ini: perkiraan kalori, protein, dan kesesuaiannya dengan target harian saya.';
  }

  if(inp)inp.value='';
  S.chat=S.chat||[];
  S.chat.push({
    id:'msg_'+Date.now(),
    role:'user',
    content:text,
    image:attachedImg||null,
    time:new Date().toTimeString().slice(0,5)
  });

  CHAT_IMAGE=null;

  CHAT_INPUT='';
  CHAT_ERR='';
  CHAT_LOADING=true;
  save();
  render();

  setTimeout(()=>{
    const el=document.getElementById('chat-history-container');
    if(el)el.scrollTop=el.scrollHeight;
  },40);

  let customKeys={};
  try{
    customKeys=JSON.parse(localStorage.getItem('nutritrack_custom_ai_keys')||'{}');
  }catch(e){}

  const userCtx=getNutriBotContext();
  const payload={
    messages:S.chat.map(m=>({role:m.role,content:m.content,image:m.image||null})),
    userContext:userCtx,
    provider:CHAT_PROVIDER||'auto',
    custom_keys:customKeys
  };

  try{
    const controller=new AbortController();
    const clientTimer=setTimeout(()=>controller.abort(),7000); // 7s client timeout

    let res=null;
    let resText='';
    let data=null;

    try{
      res=await fetch('/api/ai-chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload),
        signal:controller.signal
      });
      resText=await res.text();
      try{
        data=JSON.parse(resText);
      }catch(e){
        data=null;
      }
    }catch(netErr){
      data=null;
    }finally{
      clearTimeout(clientTimer);
    }

    if(data&&data.success&&(data.message||data.text)){
      S.chat.push({
        id:'msg_'+Date.now(),
        role:'assistant',
        content:data.message||data.text,
        time:new Date().toTimeString().slice(0,5),
        provider:data.provider_name||data.provider||'AI Coach',
        model:data.model||'',
        latencyMs:data.latency_ms||0
      });
      CHAT_ERR='';
    }else{
      // Seamless Clinical Fallback: Always respond immediately without technical errors
      const clinicalReply=getClientClinicalResponse(userCtx,text,!!attachedImg);
      S.chat.push({
        id:'msg_'+Date.now(),
        role:'assistant',
        content:clinicalReply,
        time:new Date().toTimeString().slice(0,5),
        provider:'Mifflin–St Jeor Clinical Engine',
        model:'clinical-rules-v2',
        latencyMs:120
      });
      CHAT_ERR='';
    }
  }catch(err){
    try{
      const fallbackReply=getClientClinicalResponse(userCtx,text,!!attachedImg);
      S.chat.push({
        id:'msg_'+Date.now(),
        role:'assistant',
        content:fallbackReply,
        time:new Date().toTimeString().slice(0,5),
        provider:'Mifflin–St Jeor Clinical Engine',
        model:'clinical-rules-v2',
        latencyMs:120
      });
      CHAT_ERR='';
    }catch(_){
      CHAT_ERR='Asisten AI sedang memproses data nutrisimu. Silakan coba sesaat lagi.';
    }
  }finally{
    CHAT_LOADING=false;
    save();
    render();
    setTimeout(()=>{
      const el=document.getElementById('chat-history-container');
      if(el)el.scrollTop=el.scrollHeight;
      const inp=document.getElementById('chat-input');
      if(inp)inp.focus();
    },50);
  }
}

function getMascotPos(){
  try{
    const saved=JSON.parse(localStorage.getItem('nutribot_mascot_pos')||'null');
    if(saved&&typeof saved.x==='number'&&typeof saved.y==='number'){
      const winW=window.innerWidth||390,winH=window.innerHeight||800;
      const maxX=winW-68,maxY=winH-80;
      return{x:Math.max(8,Math.min(maxX,saved.x)),y:Math.max(68,Math.min(maxY,saved.y))};
    }
  }catch(e){}
  const winW=window.innerWidth||390,winH=window.innerHeight||800;
  return{x:Math.max(8,winW-72),y:Math.max(68,winH-155)};
}

function renderMascotButton(){
  const pos=getMascotPos();
  return `<div id="nutribot-float-btn" class="fixed z-40 flex items-center justify-center select-none" style="left:${pos.x}px;top:${pos.y}px;width:58px;height:58px;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,0.22);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;overflow:hidden;background:#ffffff;border:2px solid #ffffff" title="Tanya NutriBot AI">
    <img src="nutribot-avatar.png" alt="NutriBot AI" style="width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none;display:block" draggable="false" onerror="this.onerror=null;this.src='nutribot-avatar.jpg'">
  </div>`;
}

let _mascotDragging=false;
let _mascotStartX=0,_mascotStartY=0;
let _mascotInitialLeft=0,_mascotInitialTop=0;
let _mascotMoved=false;

function initDraggableMascot(){
  const btn=document.getElementById('nutribot-float-btn');
  if(!btn||btn._dragInitialized)return;
  btn._dragInitialized=true;

  const onPointerDown=e=>{
    if(e.button!==undefined&&e.button!==0)return;
    const clientX=e.clientX??(e.touches&&e.touches[0].clientX);
    const clientY=e.clientY??(e.touches&&e.touches[0].clientY);
    if(clientX===undefined||clientY===undefined)return;

    _mascotDragging=true;
    _mascotMoved=false;
    _mascotStartX=clientX;
    _mascotStartY=clientY;

    const rect=btn.getBoundingClientRect();
    _mascotInitialLeft=rect.left;
    _mascotInitialTop=rect.top;

    btn.style.cursor='grabbing';
    btn.style.transition='transform 0.15s ease';
    btn.style.transform='scale(1.08)';

    window.addEventListener('pointermove',onPointerMove,{passive:false});
    window.addEventListener('pointerup',onPointerUp);
    window.addEventListener('pointercancel',onPointerUp);
    window.addEventListener('touchmove',onPointerMove,{passive:false});
    window.addEventListener('touchend',onPointerUp);
    window.addEventListener('touchcancel',onPointerUp);
  };

  const onPointerMove=e=>{
    if(!_mascotDragging)return;
    const clientX=e.clientX??(e.touches&&e.touches[0].clientX);
    const clientY=e.clientY??(e.touches&&e.touches[0].clientY);
    if(clientX===undefined||clientY===undefined)return;

    const dx=clientX-_mascotStartX;
    const dy=clientY-_mascotStartY;

    if(Math.hypot(dx,dy)>6){
      _mascotMoved=true;
      if(e.cancelable)e.preventDefault();
    }

    if(_mascotMoved){
      const btnW=btn.offsetWidth||56;
      const btnH=btn.offsetHeight||56;
      const maxLeft=window.innerWidth-btnW-8;
      const maxTop=window.innerHeight-btnH-72;
      const newLeft=Math.max(8,Math.min(maxLeft,_mascotInitialLeft+dx));
      const newTop=Math.max(64,Math.min(maxTop,_mascotInitialTop+dy));

      btn.style.transition='none';
      btn.style.left=newLeft+'px';
      btn.style.top=newTop+'px';
      btn.style.right='auto';
      btn.style.bottom='auto';
    }
  };

  const onPointerUp=()=>{
    if(!_mascotDragging)return;
    _mascotDragging=false;
    btn.style.cursor='grab';
    btn.style.transform='';

    window.removeEventListener('pointermove',onPointerMove);
    window.removeEventListener('pointerup',onPointerUp);
    window.removeEventListener('pointercancel',onPointerUp);
    window.removeEventListener('touchmove',onPointerMove);
    window.removeEventListener('touchend',onPointerUp);
    window.removeEventListener('touchcancel',onPointerUp);

    if(_mascotMoved){
      const btnW=btn.offsetWidth||56;
      const curLeft=parseFloat(btn.style.left)||0;
      const curTop=parseFloat(btn.style.top)||0;
      const midScreen=window.innerWidth/2;
      const snapLeft=(curLeft+btnW/2<midScreen)?12:(window.innerWidth-btnW-12);

      btn.style.transition='left 0.25s cubic-bezier(0.2,0.9,0.3,1.2), top 0.2s ease';
      btn.style.left=snapLeft+'px';
      try{
        localStorage.setItem('nutribot_mascot_pos',JSON.stringify({x:snapLeft,y:curTop}));
      }catch(err){}
      setTimeout(()=>{if(btn)btn.style.transition='';},300);
    }else{
      openNutriBotChat();
    }
  };

  btn.addEventListener('pointerdown',onPointerDown);

function getAimColorHex(category, idx = 0) {
  if (category && AIM_PRD_COLORS[category]) return AIM_PRD_COLORS[category];
  return AIM_COLORS[idx % AIM_COLORS.length].stroke;
}

function getAimProviderName(code) {
  switch (code) {
    case 'gemini': return 'Google Gemini';
    case 'openai': return 'OpenAI (GPT-4o-mini)';
    case 'groq': return 'Groq Vision (Qwen)';
    case 'anthropic': return 'Anthropic Claude';
    case 'openrouter': return 'OpenRouter';
    default: return 'Auto (Cascade)';
  }
}

function getAimDefaultBox(idx, total) {
  if (total <= 1) return [180, 180, 820, 820];
  if (total === 2) {
    return idx === 0 ? [220, 120, 780, 480] : [220, 520, 780, 880];
  }
  if (total === 3) {
    if (idx === 0) return [140, 200, 480, 800];
    if (idx === 1) return [520, 140, 860, 480];
    return [520, 520, 860, 860];
  }
  const row = Math.floor(idx / 2) % 2;
  const col = idx % 2;
  const ymin = 140 + row * 400;
  const xmin = 140 + col * 400;
  return [ymin, xmin, ymin + 320, xmin + 320];
}

function getAimDefaultPolygon(idx, total) {
  const b = getAimDefaultBox(idx, total);
  const [ymin, xmin, ymax, xmax] = b;
  const cx = (xmin + xmax) / 2;
  const cy = (ymin + ymax) / 2;
  const rx = Math.max(30, (xmax - xmin) / 2);
  const ry = Math.max(30, (ymax - ymin) / 2);
  const pts = [];
  const n = 16;
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * 2 * Math.PI;
    const wobble = 1.0 + (Math.sin(angle * 3) * 0.03) + (Math.cos(angle * 5) * 0.018);
    const px = Math.max(0, Math.min(1000, Math.round(cx + Math.cos(angle) * rx * wobble)));
    const py = Math.max(0, Math.min(1000, Math.round(cy + Math.sin(angle) * ry * wobble)));
    pts.push([px, py]);
  }
  return pts;
}

function calcAimCentroid(pts) {
  if (!pts || !pts.length) return [500, 500];
  let sx = 0, sy = 0;
  for (const p of pts) {
    sx += Number(p[0]) || 0;
    sy += Number(p[1]) || 0;
  }
  return [Math.round(sx / pts.length), Math.round(sy / pts.length)];
}

function calcAimTagPosition(it) {
  if (it.tagAnchor && typeof it.tagAnchor.x === 'number') {
    return it.tagAnchor;
  }
  let bbox = it.box2d;
  if (!bbox && Array.isArray(it.polygonMask) && it.polygonMask.length >= 3) {
    let minX = 1000, maxX = 0, minY = 1000, maxY = 0;
    for (const p of it.polygonMask) {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }
    bbox = [minY, minX, maxY, maxX];
  }

  if (!bbox || bbox.length < 4) {
    const c = it.centroid || [500, 500];
    return {
      x: c[0],
      y: Math.max(30, c[1] - 80),
      place: 'above',
      anchorX: c[0],
      anchorY: c[1],
    };
  }

  const [ymin, xmin, ymax, xmax] = bbox;
  const midX = Math.round((xmin + xmax) / 2);

  let place = 'above';
  let tagY = ymin - 45;
  let anchorY = ymin;

  if (ymin <= 85) {
    place = 'below';
    tagY = ymax + 45;
    anchorY = ymax;
  }

  const tagX = Math.max(80, Math.min(920, midX));
  tagY = Math.max(25, Math.min(975, tagY));

  return {
    x: tagX,
    y: tagY,
    place,
    anchorX: midX,
    anchorY,
  };
}

function pointsToSmoothPath(pts, tension = 0.85) {
  if (!Array.isArray(pts) || pts.length < 3) return '';
  const n = pts.length;
  let d = 'M ' + Math.round(pts[0][0]) + ' ' + Math.round(pts[0][1]);
  for (let i = 0; i < n; i++) {
    const pPrev = pts[(i - 1 + n) % n];
    const pCurr = pts[i];
    const pNext = pts[(i + 1) % n];
    const pNext2 = pts[(i + 2) % n];

    const cp1x = Math.round(pCurr[0] + ((pNext[0] - pPrev[0]) / 6) * tension);
    const cp1y = Math.round(pCurr[1] + ((pNext[1] - pPrev[1]) / 6) * tension);
    const cp2x = Math.round(pNext[0] - ((pNext2[0] - pCurr[0]) / 6) * tension);
    const cp2y = Math.round(pNext[1] - ((pNext2[1] - pCurr[1]) / 6) * tension);

    d += ' C ' + cp1x + ' ' + cp1y + ', ' + cp2x + ' ' + cp2y + ', ' + Math.round(pNext[0]) + ' ' + Math.round(pNext[1]);
  }
  return d + ' Z';
}

function refineContourEdgesWithCanvas(imgSrc, items) {
  return new Promise(resolve => {
    if (!imgSrc || !items || !items.length) return resolve(items);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const cw = 320;
        const ch = Math.max(100, Math.round(320 * (img.height / (img.width || 1))));
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, cw, ch);
        const imgData = ctx.getImageData(0, 0, cw, ch).data;

        const getRgb = (nx, ny) => {
          const cx = Math.max(0, Math.min(cw - 1, Math.round((nx / 1000) * cw)));
          const cy = Math.max(0, Math.min(ch - 1, Math.round((ny / 1000) * ch)));
          const idx = (cy * cw + cx) * 4;
          return [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
        };

        const colorDiff = (c1, c2) => {
          const dr = c1[0] - c2[0];
          const dg = c1[1] - c2[1];
          const db = c1[2] - c2[2];
          return Math.sqrt(dr * dr + dg * dg + db * db);
        };

        items.forEach(it => {
          if (!Array.isArray(it.polygonMask) || it.polygonMask.length < 5) return;
          const c = it.centroid || calcAimCentroid(it.polygonMask);
          const cx = c[0], cy = c[1];
          const newPts = [];

          for (const pt of it.polygonMask) {
            const vx = pt[0] - cx;
            const vy = pt[1] - cy;
            const dist = Math.hypot(vx, vy);
            if (dist < 12) {
              newPts.push(pt);
              continue;
            }
            const ux = vx / dist;
            const uy = vy / dist;

            let maxGrad = -1;
            let bestOffset = 0;
            const stepRange = Math.max(8, Math.min(32, Math.round(dist * 0.15)));

            for (let s = -stepRange; s <= stepRange; s += 3) {
              const d1 = dist + s - 3;
              const d2 = dist + s + 3;
              const c1 = getRgb(cx + ux * d1, cy + uy * d1);
              const c2 = getRgb(cx + ux * d2, cy + uy * d2);
              const grad = colorDiff(c1, c2);
              if (grad > maxGrad && grad > 22) {
                maxGrad = grad;
                bestOffset = s;
              }
            }

            if (maxGrad > 22 && Math.abs(bestOffset) <= stepRange) {
              newPts.push([
                Math.max(0, Math.min(1000, Math.round(pt[0] + ux * bestOffset))),
                Math.max(0, Math.min(1000, Math.round(pt[1] + uy * bestOffset)))
              ]);
            } else {
              newPts.push(pt);
            }
          }
          it.polygonMask = newPts;
        });
      } catch (e) {
        console.warn('Contour edge snapping error:', e);
      }
      resolve(items);
    };
    img.onerror = () => resolve(items);
    img.src = imgSrc;
  });
}

let _aimCamFacing='environment';

function stopAimCamera(){
  if(_aimStream){
    _aimStream.getTracks().forEach(t=>t.stop());
    _aimStream=null;
  }
}

async function initAimCamera(){
  stopAimCamera();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(AIM){AIM.err='Kamera tidak didukung di browser ini. Gunakan tombol "Pilih dari Galeri".';render()}
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:_aimCamFacing},width:{ideal:1280,min:640},height:{ideal:960,min:480}},
      audio:false
    });
    _aimStream=stream;
    const v=document.getElementById('aim-video');
    if(v){
      v.srcObject=stream;
      v.setAttribute('playsinline','true');
      v.setAttribute('webkit-playsinline','true');
      await v.play().catch(()=>{});
    }
  }catch(err){
    if(AIM){AIM.err='Gagal akses kamera: '+(err.name==='NotAllowedError'?'Izin kamera ditolak. Berikan izin di browser atau gunakan tombol "Pilih dari Galeri".':err.message);render()}
  }
}

function captureAimPhoto(){
  const v=document.getElementById('aim-video');
  if(!v){if(AIM){AIM.err='Kamera belum siap';render()}return}
  const vw=v.videoWidth||640;
  const vh=v.videoHeight||480;
  if(vw<=0||vh<=0){
    if(AIM){AIM.err='Kamera sedang memuat, tunggu 1 detik lalu tekan tombol lagi.';render()}
    return;
  }

  const maxDim=1024;
  const scale=Math.min(1,maxDim/Math.max(vw,vh));
  const c=document.createElement('canvas');
  c.width=Math.round(vw*scale);
  c.height=Math.round(vh*scale);
  const ctx=c.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(v,0,0,c.width,c.height);
  const dataUrl=c.toDataURL('image/jpeg',0.75);
  const b64=dataUrl.split(',')[1];
  stopAimCamera();

  if(AIM){
    AIM.step='preview';
    AIM.preview=dataUrl;
    AIM.imageData=b64;
    AIM.mimeType='image/jpeg';
    AIM.err='';
  }
  render();
}

let _aimProgressInterval = null;

function startAimProgress(mode = 'food') {
  if (_aimProgressInterval) clearInterval(_aimProgressInterval);

  const isFood = (mode === 'food');
  const stages = isFood ? [
    { atSec: 0.0, pct: 15, node: 0, title: 'Persiapan Citra Foto', desc: 'Kalibrasi aspek rasio & resolusi piring...' },
    { atSec: 1.2, pct: 38, node: 1, title: 'Segmentasi AI Vision', desc: 'Mendeteksi batas kontur & lekukan makanan...' },
    { atSec: 3.2, pct: 65, node: 2, title: 'Porsimetri & Densitas', desc: 'Menghitung estimasi luas, volume & gramasi URT...' },
    { atSec: 5.5, pct: 86, node: 3, title: 'Dekomposisi Nutrisi', desc: 'Mencocokkan database gizi & lemak tersembunyi...' },
    { atSec: 8.5, pct: 93, node: 3, title: 'Menyusun Hasil Piring', desc: 'Menghubungi AI cadangan untuk memastikan hasil optimal...' },
  ] : [
    { atSec: 0.0, pct: 15, node: 0, title: 'Pemindaian Label', desc: 'Mendeteksi area Informasi Nilai Gizi & merek...' },
    { atSec: 1.2, pct: 40, node: 1, title: 'Ekstraksi Angka OCR', desc: 'Mengekstrak kalori, protein, lemak & natrium...' },
    { atSec: 3.2, pct: 68, node: 2, title: 'Normalisasi BPOM', desc: 'Konversi ke basis standar 100g / 100ml...' },
    { atSec: 5.5, pct: 88, node: 3, title: 'Validasi Atwater', desc: 'Memverifikasi hukum fisika energi pangan...' },
    { atSec: 8.5, pct: 94, node: 3, title: 'Finalisasi Master Data', desc: 'Menghubungi AI cadangan untuk memastikan akurasi data...' },
  ];

  const startTime = Date.now();
  let currentPct = 10;

  const updateUI = () => {
    const elapsedSec = (Date.now() - startTime) / 1000;

    let activeStage = stages[0];
    for (let i = 0; i < stages.length; i++) {
      if (elapsedSec >= stages[i].atSec) {
        activeStage = stages[i];
      }
    }

    if (currentPct < activeStage.pct) {
      currentPct += Math.max(1, Math.round((activeStage.pct - currentPct) * 0.25));
    } else if (currentPct < 95 && elapsedSec > 8) {
      if (Math.random() > 0.6) currentPct = Math.min(95, currentPct + 1);
    }

    const barEl = document.getElementById('aim-progress-bar');
    const pctEl = document.getElementById('aim-progress-percent');
    const titleEl = document.getElementById('aim-stage-title');
    const descEl = document.getElementById('aim-stage-desc');
    const timerEl = document.getElementById('aim-elapsed-timer');
    const tipEl = document.getElementById('aim-loading-status-tip');

    if (barEl) barEl.style.width = currentPct + '%';
    if (pctEl) pctEl.textContent = currentPct + '%';
    if (titleEl) titleEl.textContent = activeStage.title;
    if (descEl) descEl.textContent = activeStage.desc;
    if (timerEl) timerEl.textContent = elapsedSec.toFixed(1) + 's';

    if (tipEl) {
      if (elapsedSec > 7) {
        tipEl.innerHTML = '<span style="color:#d97706;font-weight:600">🔄 AI cadangan aktif...</span>';
      } else {
        tipEl.textContent = 'Sedang memproses...';
      }
    }

    for (let n = 0; n < 4; n++) {
      const nodeEl = document.getElementById('aim-step-node-' + n);
      if (nodeEl) {
        if (n < activeStage.node) {
          nodeEl.style.background = 'rgba(16,185,129,0.12)';
          nodeEl.style.border = '1px solid #10b981';
          const tEl = nodeEl.querySelector('.text-\\[10px\\]');
          if (tEl) { tEl.style.color = '#10b981'; tEl.textContent = '✓ Tahap ' + (n + 1); }
        } else if (n === activeStage.node) {
          nodeEl.style.background = 'rgba(124,58,237,0.15)';
          nodeEl.style.border = '1px solid #7c3aed';
          const tEl = nodeEl.querySelector('.text-\\[10px\\]');
          if (tEl) { tEl.style.color = '#7c3aed'; tEl.textContent = 'Tahap ' + (n + 1); }
        } else {
          nodeEl.style.background = 'var(--tk)';
          nodeEl.style.border = '1px solid transparent';
          const tEl = nodeEl.querySelector('.text-\\[10px\\]');
          if (tEl) { tEl.style.color = 'var(--mu)'; tEl.textContent = 'Tahap ' + (n + 1); }
        }
      }
    }
  };

  _aimProgressInterval = setInterval(updateUI, 250);
  updateUI();
}

async function finishAimProgress() {
  if (_aimProgressInterval) {
    clearInterval(_aimProgressInterval);
    _aimProgressInterval = null;
  }
  const barEl = document.getElementById('aim-progress-bar');
  const pctEl = document.getElementById('aim-progress-percent');
  const titleEl = document.getElementById('aim-stage-title');
  const descEl = document.getElementById('aim-stage-desc');
  const tipEl = document.getElementById('aim-loading-status-tip');

  if (barEl) barEl.style.width = '100%';
  if (pctEl) pctEl.textContent = '100%';
  if (titleEl) titleEl.textContent = 'Selesai!';
  if (descEl) descEl.textContent = 'Menyiapkan visualisasi hasil...';
  if (tipEl) tipEl.innerHTML = '<span style="color:#10b981;font-weight:600">✓ Berhasil</span>';

  for (let n = 0; n < 4; n++) {
    const nodeEl = document.getElementById('aim-step-node-' + n);

  }

  await new Promise(r => setTimeout(r, 320));
}

function stopAimProgress() {
  if (_aimProgressInterval) {
    clearInterval(_aimProgressInterval);
    _aimProgressInterval = null;
  }
}

async function runAimAnalysis(){
  if(!AIM||!AIM.imageData)return;
  AIM.step='analyzing';
  render();
  startAimProgress(AIM.mode);
  try{
    let customKeys = {};
    try { customKeys = JSON.parse(localStorage.getItem('nutritrack_custom_ai_keys') || '{}'); } catch(e){}
    const chosenProvider = S.aiProvider || localStorage.getItem('nutritrack_ai_provider') || 'auto';
    const payload = {
      mode: AIM.mode,
      image: AIM.imageData,
      mimeType: AIM.mimeType,
      provider: chosenProvider,
      custom_keys: customKeys
    };

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 45000); // 45s safety timeout

    let resp;
    try {
      resp = await fetch('/api/ai-food-scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
    } catch(netErr) {
      clearTimeout(timeoutId);
      stopAimProgress();
      if (netErr.name === 'AbortError') {
        throw new Error('Proses analisis melebihi batas waktu (45 detik). Coba pilih opsi AI lain seperti OpenAI atau periksa koneksi internet Anda.');
      }
      throw new Error('Koneksi terputus atau server tidak dapat dijangkau. Pastikan perangkat Anda terhubung ke internet.');
    }
    clearTimeout(timeoutId);

    let data;
    const respText = await resp.text();
    try {
      data = JSON.parse(respText);
    } catch (parseErr) {
      stopAimProgress();
      throw new Error(`Server AI mengembalikan respon non-JSON (${resp.status}): ${respText.slice(0, 160)}`);
    }

    if(!resp.ok || data.error){
      stopAimProgress();
      AIM.step='preview';
      AIM.err=data.error || `Terjadi kesalahan sistem AI (HTTP ${resp.status})`;
      render();
      return;
    }

    // Berhasil! Animasi 100% dan lanjut ke visualisasi hasil
    await finishAimProgress();

    AIM.providerUsed = data.provider_used || '';
    AIM.latencyMs = data.latency_ms || 0;
    AIM.isFallback = Boolean(data.is_fallback);
    AIM.fallbackNotice = data.fallback_notice || '';

    if(AIM.mode==='food'){
      const detected=data.detected_items||[];
      AIM.scaleRef=data.scale_reference_detected||'Piring / Wadah Standar';
      AIM.confidence=data.overall_confidence||0.9;
      AIM.items=detected.map((item, idx)=>{
        const estG=Number(item.estimated_weight_g)||100;
        const urtAmt=Number(item.urt_amount)||1.0;
        const nutr=item.nutrition||{};
        const local=all().find(f=>f.n.toLowerCase()===item.item_name_id.toLowerCase()||(item.item_name_id.toLowerCase().includes(f.n.toLowerCase())&&f.n.length>3));
        const seg = item.visual_segmentation || {};
        const polyMask = seg.polygon_mask || item.polygon_mask || null;
        const b2d = seg.box_2d || item.box_2d || null;
        const centroid = seg.centroid || item.centroid || null;
        const tagAnchor = seg.tag_anchor || item.tag_anchor || null;
        const hlColor = seg.highlight_color_hex || item.highlight_color_hex || getAimColorHex(item.food_category, idx);

        return {
          id: item.id || ('ai_it_'+Date.now()+'_'+idx),
          name: item.item_name_id || 'Makanan',
          polygonMask: polyMask,
          box2d: b2d,
          centroid: centroid,
          tagAnchor: tagAnchor,
          highlightColor: hlColor,
          category: item.food_category || 'carbohydrate',
          method: item.cooking_method || 'steamed_boiled',
          gram: estG,
          baseGram: estG,
          urtAmount: urtAmt,
          baseUrtAmount: urtAmt,
          urtUnit: item.urt_unit || 'porsi',
          urtLabel: item.urt_display_label || `${estG}g`,
          hiddenOil: Number(item.hidden_oil_or_coconut_milk_g)||0,
          baseKcalPer100: local ? local.k : ((nutr.energy_kcal||150) / Math.max(0.1, estG/100)),
          baseProtPer100: local ? local.p : ((nutr.protein_g||4) / Math.max(0.1, estG/100)),
          baseCarbPer100: local ? local.c : ((nutr.carb_total_g||20) / Math.max(0.1, estG/100)),
          baseFatPer100: local ? local.f : ((nutr.fat_total_g||3) / Math.max(0.1, estG/100)),
          nutrition: { ...nutr },
          localFood: local || null
        };
      });
      if(AIM.preview && AIM.items.length){
        await refineContourEdgesWithCanvas(AIM.preview, AIM.items);
      }
      AIM.showBoxes=true;
      AIM.showTags=true;
      AIM.selectedIdx=null;
      AIM.step='food_results';
      AIM.err='';
    } else {
      // mode === 'label'
      const norm=data.normalized;
      const meta=norm?.validation_meta||{};
      AIM.step='label_result';
      AIM.nutrition=data.nutrition||{};
      AIM.needsReview=Boolean(meta.needs_review);
      AIM.reviewReasons=meta.review_reasons||[];
      AIM.bpomCorrections=meta.bpom_corrections||[];
      AIM.err='';
    }
  }catch(e){
    stopAimProgress();
    console.error('AIM error:', e);
    AIM.step='preview';
    AIM.err=e.message || 'Koneksi gagal atau server AI sedang sibuk. Silakan coba klik tombol analisis lagi.';
  }
  render();
}

function saveAimFoodJournal(){
  if(!AIM||!AIM.items||!AIM.items.length)return;
  const h=new Date().getHours(),mealCode=h<10?'b':h<15?'l':h<17?'s':'d';
  let saved=0;
  const previewImg=AIM.preview;
  AIM.items.forEach((it,i)=>{
    const g=Number(it.gram);
    if(!(g>0))return;
    const foodId=it.localFood?it.localFood.id:('ai_'+Date.now()+'_'+i);
    const sn={
      k: it.nutrition.energy_kcal,
      p: it.nutrition.protein_g,
      c: it.nutrition.carb_total_g,
      f: it.nutrition.fat_total_g,
      fi: it.nutrition.dietary_fiber_g||0,
      su: it.nutrition.sugar_total_g||0,
      na: it.nutrition.sodium_mg||0
    };
    if(!it.localFood && !S.cf.some(f=>f.id===foodId)){
      const p100_k=Math.round((sn.k/g)*100);
      const p100_p=Math.round(((sn.p/g)*100)*10)/10;
      const p100_c=Math.round(((sn.c/g)*100)*10)/10;
      const p100_f=Math.round(((sn.f/g)*100)*10)/10;
      const p100_na=Math.round((sn.na/g)*100);
      S.cf.push({
        id: foodId,
        n: it.name,
        cat: 'Makanan',
        k: p100_k,
        p: p100_p,
        c: p100_c,
        f: p100_f,
        fi: sn.fi||0,
        su: sn.su||0,
        na: p100_na,
        s: { porsi: g },
        d: null,
        src: 'AI Scan',
        st: 'Estimasi',
        v: 1
      });
    }
    if(previewImg && foodId.startsWith('ai_')){
      compressThumb(previewImg, thumb=>{
        S.fimg[foodId]=thumb;
        idbSetImage(foodId,thumb);
        save();
      });
    }
    S.logs.push({
      id:'n'+Date.now()+'_'+i,
      d:D,
      m:mealCode,
      t:new Date().toTimeString().slice(0,5),
      fo:foodId,
      n:it.name,
      q:g,
      u:'g',
      g:g,
      est:true,
      sn,
      p100:{
        k: Math.round((sn.k/g)*100),
        p: Math.round(((sn.p/g)*100)*10)/10,
        c: Math.round(((sn.c/g)*100)*10)/10,
        f: Math.round(((sn.f/g)*100)*10)/10,
        fi:0,
        su:0,
        na:Math.round((sn.na/g)*100)
      }
    });
    saved++;
  });
  save();
  stopAimCamera();
  AIM=null;
  render();
  tst(saved>0?`${saved} item makanan berhasil dicatat ke Food Journal!`:'Tidak ada item yang disimpan.');
}

let _zxReader=null;
async function startBcDetectionLoop(){_bcScanning=true;
const video=document.getElementById('bc-video');if(!video)return;

// 1. Jalankan ZXing decodeFromVideoElementContinuously agar loop pemindaian selalu aktif di semua browser
if(window.ZXing&&window.ZXing.BrowserMultiFormatReader){
  try{
    if(!_zxReader){
      const hints=new Map();
      if(ZXing.BarcodeFormat){
        const fmts=[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.QR_CODE].filter(Boolean);
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,fmts);
      }
      if(ZXing.DecodeHintType&&ZXing.DecodeHintType.TRY_HARDER){
        hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
      }
      _zxReader=new ZXing.BrowserMultiFormatReader(hints);
    }
    _zxReader.decodeFromVideoElementContinuously(video,(result,err)=>{
      if(!_bcScanning||!BCM||BCM.step!=='scan')return;
      if(result&&result.getText&&result.getText()){
        _bcScanning=false;
        try{_zxReader.reset()}catch(e){}
        onBarcodeScanned(result.getText());
      }
    });
  }catch(e){console.warn('ZXing continuous loop error:',e)}
}

// 2. Jalankan juga Native BarcodeDetector via canvas (kompatibel penuh di iOS Safari & Chrome tanpa error video playback)
if('BarcodeDetector' in window){
  try{
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const checkFrame=async()=>{
      if(!_bcScanning||!BCM||BCM.step!=='scan')return;
      if(video.readyState>=2&&video.videoWidth>0){
        canvas.width=Math.min(640,video.videoWidth);
        canvas.height=Math.round(canvas.width*(video.videoHeight/video.videoWidth));
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        try{
          const barcodes=await detector.detect(canvas);
          if(barcodes&&barcodes.length>0&&barcodes[0].rawValue){
            if(!_bcScanning)return;
            _bcScanning=false;
            try{if(_zxReader)_zxReader.reset()}catch(e){}
            onBarcodeScanned(barcodes[0].rawValue);
            return;
          }
        }catch(e){}
      }
      if(_bcScanning&&BCM&&BCM.step==='scan'){
        requestAnimationFrame(()=>setTimeout(checkFrame,120));
      }
    };
    requestAnimationFrame(checkFrame);
  }catch(e){}
}}

async function onBarcodeScanned(rawCode){
  const code=String(rawCode||'').trim();if(!code)return;
  stopBcCamera();
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=880;g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.12);osc.start();osc.stop(ctx.currentTime+0.12)}catch(e){}

  // LAPIS 1: Cek Database Lokal
  const local=all().find(f=>(f.bc&&String(f.bc).trim()===code));
  if(local){BCM=null;openM({fo:local.id,m:'b'});render();tst('Ditemukan di katalog lokal: '+local.n);return}
  if(BC_CATALOG[code]){const it=BC_CATALOG[code];BCM={step:'confirm',code:code,err:'',torch:false,hasTorch:false,camFacing:'environment',item:{...it},manualCode:code};render();tst('Ditemukan: '+it.n);return}

  // LAPIS 2: Panggil Backend /api/barcode-lookup (Open Food Facts v2 & BPOM Normalizer)
  BCM={step:'loading',code:code,err:'',torch:false,hasTorch:false,camFacing:'environment',item:null,manualCode:code,searchQ:''};render();
  try{
    const resp=await fetch(`/api/barcode-lookup?code=${encodeURIComponent(code)}`);
    if(resp.ok){
      const data=await resp.json();
      if(data.found && data.data){
        const norm=data.data;
        const mf=norm.master_food||{};
        const n100=norm.food_nutrients_100||{};
        const sv=norm.food_serving_units||[];
        const meta=norm.validation_meta||{};
        BCM.step='confirm';
        BCM.item={
          n: mf.name||'Produk Kemasan',
          br: mf.brand||'',
          cat: mf.category||'Makanan Kemasan',
          k: String(n100.energy_kcal||0),
          p: String(n100.protein_g||0),
          c: String(n100.carb_total_g||0),
          f: String(n100.fat_total_g||0),
          fi: String(n100.dietary_fiber_g!=null?n100.dietary_fiber_g:''),
          su: String(n100.sugar_total_g!=null?n100.sugar_total_g:''),
          na: String(n100.sodium_mg!=null?n100.sodium_mg:''),
          servName: sv[0]?.unit_name||'sajian',
          servGram: sv[0]?.gram_equivalent?String(sv[0].gram_equivalent):'100',
          src: data.source==='OPEN_FOOD_FACTS'?'Open Food Facts':'Katalog Master',
          img: data.product_image||'',
          needsReview: meta.needs_review,
          reviewReasons: meta.review_reasons||[],
          bpomCorrections: meta.bpom_corrections||[]
        };
        render();
        return;
      } else {
        BCM.step='not_found';
        BCM.msg=data.message||`Barcode ${code} belum terdaftar di Open Food Facts.`;
        render();
        return;
      }
    }
  }catch(e){
    console.warn('Barcode lookup network error:', e);
  }

  stopBcCamera();
  BCM={step:'not_found',code:code,msg:`Barcode ${code} belum terdaftar di Open Food Facts.`,err:'',torch:false,hasTorch:false,camFacing:'environment',item:null,manualCode:code,searchQ:''};
  render();
}

let _counterAnimFrames = [];
function triggerIndicatorAnimations() {
  if (typeof window === 'undefined' || !window.requestAnimationFrame) return;
  if (_counterAnimFrames.length > 0) {
    _counterAnimFrames.forEach(id => cancelAnimationFrame(id));
    _counterAnimFrames = [];
  }
  const counterElements = document.querySelectorAll('[data-counter]');
  if (!counterElements.length) return;

  const duration = 750;
  const startTime = performance.now();
  const isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Animasi Cincin Kalori (Web Animations API jika didukung, dengan fallback aman)
  const ringBar = document.querySelector('.ring-bar');
  if (ringBar && typeof ringBar.animate === 'function' && !isReduced) {
    try {
      const targetD = parseFloat(ringBar.getAttribute('data-d')) || 0;
      const maxC = parseFloat(ringBar.getAttribute('data-c')) || 326.7;
      if (targetD > 0) {
        ringBar.animate([
          { strokeDasharray: `0 ${maxC}` },
          { strokeDasharray: `${targetD.toFixed(1)} ${maxC}` }
        ], {
          duration: 850,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        });
      }
    } catch (_) {}
  }

  // Animasi Angka (Count-Up Numbers)
  counterElements.forEach(el => {
    const rawTarget = el.getAttribute('data-counter');
    const target = parseFloat(rawTarget);
    if (!Number.isFinite(target)) return;
    const decimals = parseInt(el.getAttribute('data-decimals') || '0', 10);
    const suffix = el.getAttribute('data-suffix') || '';
    const prefix = el.getAttribute('data-prefix') || '';
    if (isReduced || target === 0) {
      const loc = typeof curLoc === 'function' ? curLoc() : 'id-ID';
      const finalFmt = decimals > 0
        ? target.toLocaleString(loc, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
        : Math.round(target).toLocaleString(loc);
      el.textContent = prefix + finalFmt + suffix;
      return;
    }
    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const ease = 1 - Math.pow(1 - progress, 3);
      const val = target * ease;
      const loc = typeof curLoc === 'function' ? curLoc() : 'id-ID';
      const formatted = decimals > 0
        ? val.toLocaleString(loc, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
        : Math.round(val).toLocaleString(loc);
      el.textContent = prefix + formatted + suffix;
      if (progress < 1) {
        const frameId = requestAnimationFrame(frame);
        _counterAnimFrames.push(frameId);
      } else {
        const finalFmt = decimals > 0
          ? target.toLocaleString(loc, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
          : Math.round(target).toLocaleString(loc);
        el.textContent = prefix + finalFmt + suffix;
      }
    }
    const firstFrameId = requestAnimationFrame(frame);
    _counterAnimFrames.push(firstFrameId);
  });
}
